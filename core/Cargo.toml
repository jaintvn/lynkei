[workspace]
resolver = "3"
members = ["lynkei-model", "lynkei-proxy", "lynkei-ffi", "lynkei-cli", "lynkei-netstack", "lynkei-store", "lynkei-control", "lynkeid", "lynkei-bench", "lynkei-devices", "lynkei-mcp"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
# Vendored with a fix for app-side FIN/RST not waking readers (see vendor/ipstack/VENDORED.md).
ipstack = { path = "vendor/ipstack" }
