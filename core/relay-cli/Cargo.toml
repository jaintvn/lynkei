[package]
name = "relay-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
relay-model = { version = "0.1.0", path = "../relay-model" }
relay-proxy = { version = "0.1.0", path = "../relay-proxy" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
