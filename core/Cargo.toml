[workspace]
resolver = "3"
members = ["relay-model", "relay-proxy", "relay-ffi", "relay-cli", "relay-netstack", "relay-store", "relay-control", "relayd", "relay-bench", "relay-devices", "relay-demo-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
# Vendored with a fix for app-side FIN/RST not waking readers (see vendor/ipstack/VENDORED.md).
ipstack = { path = "vendor/ipstack" }
