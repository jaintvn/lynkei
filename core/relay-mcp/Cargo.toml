[package]
name = "relay-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "relay-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
relay-control = { version = "0.1.0", path = "../relay-control" }
relay-model = { version = "0.1.0", path = "../relay-model" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
