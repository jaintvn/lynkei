[package]
name = "relay-control"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
relay-devices = { version = "0.1.0", path = "../relay-devices" }
relay-model = { version = "0.1.0", path = "../relay-model" }
relay-proxy = { version = "0.1.0", path = "../relay-proxy" }
relay-store = { version = "0.1.0", path = "../relay-store" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
