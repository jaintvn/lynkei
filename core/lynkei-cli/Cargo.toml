[package]
name = "lynkei-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lynkei"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
lynkei-control = { version = "0.4.0", path = "../lynkei-control" }
lynkei-model = { version = "0.4.0", path = "../lynkei-model" }
lynkei-proxy = { version = "0.4.0", path = "../lynkei-proxy" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
