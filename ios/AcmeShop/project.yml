name: AcmeShop
options:
  bundleIdPrefix: dev.acme
  deploymentTarget:
    iOS: "17.0"
targets:
  AcmeShop:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.acme.shop
        PRODUCT_NAME: AcmeShop
        MARKETING_VERSION: 3.4.1
        CURRENT_PROJECT_VERSION: 812
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Acme Shop"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        # For a real iPhone: pick your team in Xcode (Signing & Capabilities), or set it here:
        # DEVELOPMENT_TEAM: ABCDE12345
