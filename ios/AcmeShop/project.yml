name: AcmeShop
options:
  bundleIdPrefix: dev.acme
  deploymentTarget:
    iOS: "17.0"
targets:
  AcmeShop:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        # The demo talks plain HTTP to the mock server on this Mac / local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Acme Shop talks to the demo server on your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.acme.shop
        PRODUCT_NAME: AcmeShop
        MARKETING_VERSION: 3.4.1
        CURRENT_PROJECT_VERSION: 812
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Acme Shop"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        # Signing team (your Apple ID). Change it to your own team ID if you are not jaintvn.
        DEVELOPMENT_TEAM: ABRAFHKM9D
