[package]
name = "relay-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.2"
flate2 = "1.1.11"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "http1", "webpki-roots", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
lru = "0.19.0"
rand = "0.10.4"
rcgen = { version = "0.14.10", features = ["pem", "ring", "x509-parser"] }
relay-model = { version = "0.1.0", path = "../relay-model" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
webpki-roots = "1.0.12"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
