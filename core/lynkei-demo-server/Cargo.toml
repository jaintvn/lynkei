[package]
name = "lynkei-demo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Local mock API for the Acme Shop demo apps (httpbin-style paths, no internet needed)"

[[bin]]
name = "lynkei-demo-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.2"
flate2 = "1.1.11"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "signal"] }
