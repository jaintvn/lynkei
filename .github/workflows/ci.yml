name: CI

# Manual only, to save CI minutes: run it from the Actions tab (Run workflow) or `gh workflow run CI`.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core (fmt, clippy, tests)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  apple:
    name: macOS app (XCFramework + Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: scripts/build-apple.sh
      - run: swift build --package-path apple/Relay

  android:
    name: Android (engine + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo install cargo-ndk --locked
      - name: Build engine, CLI and Kotlin bindings
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          (cd core && cargo ndk -t arm64-v8a --platform 26 build -p relay-cli -p relayd --release)
          scripts/build-android.sh
      - name: Build APK
        working-directory: android/relay-android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: relay-android-debug
          path: android/relay-android/app/build/outputs/apk/debug/app-debug.apk
# Emulator test suites run locally with scripts/test-android.sh (arm64 emulator).
