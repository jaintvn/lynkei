[package]
name = "lynkei-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lynkei-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
lynkei-control = { version = "0.4.0", path = "../lynkei-control" }
lynkei-model = { version = "0.4.0", path = "../lynkei-model" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
