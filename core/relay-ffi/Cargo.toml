[package]
name = "relay-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "relay_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
anyhow = "1.0.104"
relay-control = { version = "0.1.0", path = "../relay-control" }
relay-devices = { version = "0.1.0", path = "../relay-devices" }
relay-model = { version = "0.1.0", path = "../relay-model" }
relay-netstack = { version = "0.1.0", path = "../relay-netstack" }
relay-proxy = { version = "0.1.0", path = "../relay-proxy" }
relay-store = { version = "0.1.0", path = "../relay-store" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
uniffi = { version = "0.32.2", features = ["cli"] }
